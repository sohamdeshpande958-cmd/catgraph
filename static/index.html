<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CatGraph</title>
<style>
:root{
  --bg:#f6f5f2;--panel:#ffffff;--ink:#1d1d1b;--muted:#6b6a65;--line:#e3e1db;
  --accent:#2f5d50;--accent-soft:#e3eee9;--danger:#a33a2a;--chip:#eeece6;--hover:#f1efea;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#151614;--panel:#1d1f1c;--ink:#e8e6e0;--muted:#9a988f;--line:#30322e;
  --accent:#7fbfa8;--accent-soft:#233630;--danger:#e0806f;--chip:#2a2c28;--hover:#252724;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px}
header .sp{flex:1}
header a{color:var(--muted);text-decoration:none;font-size:13px}
header a:hover{color:var(--accent)}
main{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 49px)}
aside{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.bar{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.bar input[type=search]{flex:1}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
textarea{font-family:var(--mono);font-size:12.5px;min-height:110px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:6px 10px;cursor:pointer;white-space:nowrap}
button:hover{background:var(--hover)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
button.primary:hover{filter:brightness(1.08)}
button.danger{color:var(--danger)}
button.link{border:none;background:none;padding:2px 4px;color:var(--muted)}
#tree{overflow:auto;padding:6px 4px 20px;flex:1}
.node{display:flex;align-items:center;gap:4px;padding:3px 6px;border-radius:5px;cursor:pointer;user-select:none}
.node:hover{background:var(--hover)}
.node.sel{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tw{width:16px;text-align:center;color:var(--muted);font-size:11px;flex:none}
.node .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .ct{color:var(--muted);font-size:12px}
.node .mp{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 3px}
.kids{margin-left:14px;border-left:1px dashed var(--line)}
section.content{display:flex;flex-direction:column;min-height:0}
.crumbs{padding:12px 16px 4px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.crumbs h2{margin:0;font-size:18px}
.crumbs .meta{color:var(--muted);font-size:13px}
.tools{display:flex;gap:8px;align-items:center;padding:6px 16px 10px;flex-wrap:wrap}
.tools input[type=search]{max-width:340px}
.tools label{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px}
.tools label input{width:auto}
.tablewrap{overflow:auto;flex:1;padding:0 16px 16px}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600;background:var(--bg)}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--hover)}
td.id{font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
td.json{font-family:var(--mono);font-size:12px;color:var(--muted);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--chip);border:1px solid transparent;border-radius:999px;padding:1px 9px;font-size:12px;margin:1px 3px 1px 0}
.chip button{border:none;background:none;padding:0 0 0 2px;color:var(--muted);line-height:1}
td.inh-col{color:var(--muted);font-size:12.5px;max-width:280px}
.empty{color:var(--muted);text-align:center;padding:40px}
/* modal */
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:0;width:min(600px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.35)}
.dh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:650}
.db{padding:14px 18px;display:grid;gap:12px;max-height:70vh;overflow:auto}
.df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px}
.df .sp{flex:1}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
.picker{border:1px solid var(--line);border-radius:6px;padding:5px;background:var(--bg)}
.picker input{border:none;background:transparent;padding:4px;outline:none}
.picker input:focus{outline:none}
.sugg{border:1px solid var(--line);border-radius:6px;margin-top:4px;max-height:260px;overflow:auto;background:var(--panel)}
.sugg>div{padding:6px 9px;cursor:pointer;border-bottom:1px solid var(--line)}
.sugg>div:last-child{border-bottom:none}
.sugg>div:hover,.sugg>div.on{background:var(--accent-soft)}
.sugg .sn{font-weight:560}
.sugg .pth{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sugg .pth.top{font-style:italic}
.inh-box{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--bg);color:var(--muted);font-size:13px;min-height:34px}
.inh-box .none{font-style:italic}
.err{color:var(--danger);font-size:13px;min-height:1em}
.hint{color:var(--muted);font-size:12px}
#toast{position:fixed;bottom:16px;right:16px;background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:6px;opacity:0;transition:.2s;pointer-events:none}
#toast.on{opacity:1}
@media (max-width:760px){main{grid-template-columns:1fr;height:auto}aside{max-height:45vh}}
</style>
</head>
<body>
<header>
  <h1>CatGraph</h1><span class="sp"></span>
  <a href="/api/export">Full backup</a>
  <a href="#" id="importLink">Import</a>
  <a href="/docs" target="_blank">API docs</a>
  <input type="file" id="importFile" accept=".json" hidden>
</header>
<main>
  <aside>
    <div class="bar">
      <input type="search" id="catFilter" placeholder="Filter categories…">
      <button class="primary" id="newCat">+ Category</button>
    </div>
    <div id="tree"></div>
  </aside>
  <section class="content">
    <div class="crumbs"><h2 id="title">All entries</h2><span class="meta" id="meta"></span>
      <span class="sp"></span><button class="link" id="editCat" hidden>Edit category</button></div>
    <div class="tools">
      <input type="search" id="q" placeholder="Search description, ID or JSON…">
      <label><input type="checkbox" id="rec" checked> include sub-categories</label>
      <span style="flex:1"></span>
      <button id="expCsv" title="Export this view as CSV">Export CSV</button>
      <button id="expJson" title="Export this view as JSON (re-importable)">Export JSON</button>
      <button class="primary" id="newEntry">+ Entry</button>
    </div>
    <div class="tablewrap"><table>
      <thead><tr><th>ID</th><th>Description</th><th>Categories</th><th>Inherited</th><th>Data</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </section>
</main>

<dialog id="catDlg"><form method="dialog" id="catForm">
  <div class="dh" id="catDlgTitle">Category</div>
  <div class="db">
    <div class="field"><label>Name</label><input id="cName" required></div>
    <div class="field"><label>Description</label><input id="cDesc"></div>
    <div class="field"><label>Parent categories</label><div id="cParents"></div>
      <div class="hint">A category can have any number of parents. Suggestions show every path from the top; type a parent's name to find its children. Choices that would create a cycle are hidden.</div></div>
    <div class="field"><label>Inherited categories (from the parents above, read-only)</label><div class="inh-box" id="cInh"></div></div>
    <div class="field"><label>Child categories</label><div id="cChildren"></div></div>
    <div class="err" id="cErr"></div>
  </div>
  <div class="df"><button type="button" class="danger" id="cDel">Delete</button><span class="sp"></span>
    <button type="button" id="cCancel">Cancel</button><button class="primary" id="cSave">Save</button></div>
</form></dialog>

<dialog id="entDlg"><form method="dialog" id="entForm">
  <div class="dh" id="entDlgTitle">Entry</div>
  <div class="db">
    <div class="field"><label>Your ID (optional, unique)</label><input id="eExt"></div>
    <div class="field"><label>Description</label><input id="eDesc"></div>
    <div class="field"><label>Categories</label><div id="eCats"></div></div>
    <div class="field"><label>Inherited categories (read-only)</label><div class="inh-box" id="eInh"></div></div>
    <div class="field"><label>JSON data (optional)</label><textarea id="eData" placeholder='{"key": "value"}'></textarea></div>
    <div class="err" id="eErr"></div>
  </div>
  <div class="df"><button type="button" class="danger" id="eDel">Delete</button><span class="sp"></span>
    <button type="button" id="eCancel">Cancel</button><button class="primary" id="eSave">Save</button></div>
</form></dialog>

<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let cats = [], byId = {}, selected = null, open = new Set(), pathMemo = {};
try { open = new Set(JSON.parse(localStorage.getItem("cg_open") || "[]")); } catch {}

async function api(path, opts = {}) {
  const r = await fetch(path, {headers: {"Content-Type": "application/json"}, ...opts,
    body: opts.body && typeof opts.body !== "string" ? JSON.stringify(opts.body) : opts.body});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof j.detail === "string" ? j.detail : JSON.stringify(j.detail || j));
  return j;
}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),1800)}

/* ---------- graph helpers ---------- */
const MAX_PATHS = 12;          // cap per category so very "diamond-y" graphs stay fast
const visiting = new Set();    // guards against cycles that could arrive via import
// Every root → … → id chain, as arrays of ids.
function pathsTo(id) {
  if (pathMemo[id]) return pathMemo[id];
  const c = byId[id];
  if (!c || visiting.has(id)) return [];
  visiting.add(id);
  const ps = c.parent_ids.length
    ? c.parent_ids.flatMap(p => pathsTo(p).map(pp => [...pp, id])).slice(0, MAX_PATHS)
    : [[id]];
  visiting.delete(id);
  return pathMemo[id] = ps;
}
// Paths of the category's parents only (the category itself dropped), roots give [].
const parentPaths = id => pathsTo(id).map(p => p.slice(0, -1)).filter(p => p.length);
const pathLabel = p => p.map(i => byId[i]?.name ?? "?").join(" › ");
const ancestorIds = id => byId[id]?.ancestor_ids || [];
function descendantIds(id) {
  const out = new Set(), stack = [...(byId[id]?.child_ids || [])];
  while (stack.length) { const k = stack.pop(); if (!out.has(k) && k !== id) { out.add(k); stack.push(...(byId[k]?.child_ids || [])); } }
  return out;
}
// Union of all recursive parents of a set of categories, minus the set itself.
function inheritedOf(ids) {
  const out = new Set();
  ids.forEach(i => ancestorIds(i).forEach(a => out.add(a)));
  ids.forEach(i => out.delete(i));
  return [...out].map(i => byId[i]).filter(Boolean).sort((a, b) => a.name.localeCompare(b.name));
}
function pathsHtml(id) {
  const ps = parentPaths(id);
  if (!ps.length) return `<div class="pth top">top level</div>`;
  const shown = ps.slice(0, 3).map(p => `<div class="pth" title="${esc(pathLabel(p))}">${esc(pathLabel(p))} ›</div>`).join("");
  const more = ps.length > 3 ? `<div class="pth">+${ps.length - 3} more path${ps.length - 3 > 1 ? "s" : ""}</div>` : "";
  return shown + more;
}
const pathTip = id => parentPaths(id).map(p => pathLabel(p) + " › " + (byId[id]?.name ?? "")).join("\n") || "top level";

/* ---------- chip picker ---------- */
// `inheritedEl`: a separate element (its own field in the dialog) that lists the recursive
// parents of whatever is selected — kept apart from the chips on purpose.
function picker(el, {exclude = () => new Set(), inheritedEl = null} = {}) {
  let ids = [];
  el.innerHTML = `<div class="picker"><span class="chips"></span><input placeholder="Type a name, or a parent's name…"></div>`
    + `<div class="sugg" hidden></div>`;
  const chips = el.querySelector(".chips"), inp = el.querySelector("input"), sg = el.querySelector(".sugg");
  let hi = 0, opts = [];
  const draw = () => {
    chips.innerHTML = ids.map(id => `<span class="chip" title="${esc(pathTip(id))}">${esc(byId[id]?.name)}<button type="button" data-id="${id}">×</button></span>`).join("");
    if (inheritedEl) {
      const a = inheritedOf(ids);
      inheritedEl.innerHTML = a.length
        ? a.map(c => `<span title="${esc(pathTip(c.id))}">${esc(c.name)}</span>`).join(", ")
        : `<span class="none">none</span>`;
    }
  };
  const suggest = () => {
    const q = inp.value.trim().toLowerCase(), ex = exclude(), scored = [];
    for (const c of cats) {
      if (ids.includes(c.id) || ex.has(c.id)) continue;
      let rank = -1;
      if (!q || c.name.toLowerCase().includes(q)) rank = 0;                                       // name match
      else if (ancestorIds(c.id).some(a => byId[a]?.name.toLowerCase().includes(q))) rank = 1;     // parent-name match
      if (rank >= 0) scored.push([rank, c]);
    }
    scored.sort((a, b) => a[0] - b[0] || a[1].name.localeCompare(b[1].name));
    opts = scored.slice(0, 40).map(x => x[1]);
    if (document.activeElement !== inp) { sg.hidden = true; return; }
    sg.hidden = !opts.length; hi = 0;
    sg.innerHTML = opts.map((c, i) => `<div data-id="${c.id}" class="${i ? "" : "on"}"><div class="sn">${esc(c.name)}</div>${pathsHtml(c.id)}</div>`).join("");
    sg.scrollTop = 0;
  };
  const add = id => { if (!ids.includes(id)) ids.push(id); inp.value = ""; draw(); suggest(); };
  chips.onclick = e => { const b = e.target.closest("button"); if (b) { ids = ids.filter(x => x != b.dataset.id); draw(); } };
  sg.onmousedown = e => { const d = e.target.closest("[data-id]"); if (d) { e.preventDefault(); add(+d.dataset.id); } };
  inp.oninput = suggest; inp.onfocus = suggest; inp.onblur = () => setTimeout(() => sg.hidden = true, 100);
  inp.onkeydown = e => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault(); if (!opts.length) return;
      hi = (hi + (e.key === "ArrowDown" ? 1 : -1) + opts.length) % opts.length;
      [...sg.children].forEach((d, i) => d.classList.toggle("on", i === hi));
      sg.children[hi]?.scrollIntoView({block: "nearest"});
    }
    else if (e.key === "Enter") { e.preventDefault(); if (opts[hi]) add(opts[hi].id); }
    else if (e.key === "Escape" && !sg.hidden) { e.preventDefault(); sg.hidden = true; }
    else if (e.key === "Backspace" && !inp.value && ids.length) { ids.pop(); draw(); }
  };
  return { get: () => [...ids], set: v => { ids = [...v]; draw(); } };
}

/* ---------- category tree (DAG shown with each node under every parent) ---------- */
async function loadCats() {
  const d = await api("/api/categories");
  cats = d.categories; byId = Object.fromEntries(cats.map(c => [c.id, c])); pathMemo = {};
  if (selected && !byId[selected]) selected = null;
  drawTree();
}
function drawTree() {
  const f = $("#catFilter").value.trim().toLowerCase();
  const tree = $("#tree");
  const all = `<div class="node ${selected === null ? "sel" : ""}" data-id=""><span class="tw">◆</span><span class="nm">All entries</span></div>`;
  if (f) {
    const m = cats.filter(c => c.name.toLowerCase().includes(f));
    tree.innerHTML = all + (m.map(c => nodeHtml(c, "f" + c.id, true)).join("") || `<div class="empty">No match</div>`);
    return;
  }
  const roots = cats.filter(c => !c.parent_ids.length);
  const render = (c, path, seen) => {
    const key = path + "/" + c.id, isOpen = open.has(key), kids = c.child_ids.map(i => byId[i]).filter(Boolean)
      .sort((a, b) => a.name.localeCompare(b.name));
    let h = nodeHtml(c, key, !kids.length, isOpen);
    if (kids.length && isOpen && !seen.has(c.id)) {
      const s2 = new Set(seen).add(c.id);
      h += `<div class="kids">${kids.map(k => render(k, key, s2)).join("")}</div>`;
    }
    return h;
  };
  tree.innerHTML = all + (roots.length ? roots.map(r => render(r, "", new Set())).join("")
    : `<div class="empty">No categories yet.<br>Click “+ Category”.</div>`);
}
function nodeHtml(c, key, leaf, isOpen) {
  const tw = leaf ? "·" : (isOpen ? "▾" : "▸");
  const mp = c.parent_ids.length > 1 ? `<span class="mp" title="${c.parent_ids.length} parents">×${c.parent_ids.length}</span>` : "";
  return `<div class="node ${selected === c.id ? "sel" : ""}" data-id="${c.id}" data-key="${esc(key)}" title="${esc(pathTip(c.id))}">
    <span class="tw" data-tw="1">${tw}</span><span class="nm">${esc(c.name)}</span>${mp}<span class="ct">${c.direct_entries || ""}</span></div>`;
}
$("#tree").onclick = e => {
  const n = e.target.closest(".node"); if (!n) return;
  if (e.target.dataset.tw && n.dataset.key) {
    const k = n.dataset.key; open.has(k) ? open.delete(k) : open.add(k);
    try { localStorage.setItem("cg_open", JSON.stringify([...open])); } catch {}
    drawTree(); return;
  }
  selected = n.dataset.id ? +n.dataset.id : null; drawTree(); loadEntries();
};
$("#tree").ondblclick = e => { const n = e.target.closest(".node"); if (n && n.dataset.id) openCat(+n.dataset.id); };
$("#catFilter").oninput = drawTree;

/* ---------- entries ---------- */
let qTimer;
async function loadEntries() {
  const p = new URLSearchParams({recursive: $("#rec").checked, limit: 500});
  if (selected !== null) p.set("category_id", selected);
  if ($("#q").value.trim()) p.set("q", $("#q").value.trim());
  const c = selected !== null ? byId[selected] : null;
  $("#title").textContent = c ? c.name : "All entries";
  $("#editCat").hidden = !c;
  const parents = c ? c.parent_ids.map(i => byId[i]?.name).filter(Boolean) : [];
  try {
    const d = await api("/api/entries?" + p);
    $("#meta").textContent = `${d.total} entr${d.total === 1 ? "y" : "ies"}` + (parents.length ? ` · parents: ${parents.join(", ")}` : "");
    $("#rows").innerHTML = d.entries.length ? d.entries.map(e => `<tr class="row" data-id="${e.id}">
      <td class="id">${esc(e.ext_id ?? "#" + e.id)}</td><td>${esc(e.description)}</td>
      <td>${e.categories.map(x => `<span class="chip" title="${esc(pathTip(x.id))}">${esc(x.name)}</span>`).join("")}</td>
      <td class="inh-col">${esc(inheritedOf(e.categories.map(x => x.id)).map(x => x.name).join(", "))}</td>
      <td class="json">${e.data !== null ? esc(JSON.stringify(e.data)) : ""}</td></tr>`).join("")
      : `<tr><td colspan="5" class="empty">No entries here yet.</td></tr>`;
  } catch (err) { toast(err.message); }
}
$("#rows").onclick = e => { const r = e.target.closest("tr.row"); if (r) openEntry(+r.dataset.id); };
$("#q").oninput = () => { clearTimeout(qTimer); qTimer = setTimeout(loadEntries, 200); };
$("#rec").onchange = loadEntries;

/* ---------- category dialog ---------- */
let editingCat = null, origParents = [], origChildren = [];
// A parent must not be the category itself, one of its descendants, or a descendant of a chosen child.
const parentPick = picker($("#cParents"), {inheritedEl: $("#cInh"), exclude: () => {
  const ex = new Set();
  if (editingCat) { ex.add(editingCat); descendantIds(editingCat).forEach(i => ex.add(i)); }
  childPick.get().forEach(c => { ex.add(c); descendantIds(c).forEach(i => ex.add(i)); });
  return ex;
}});
// A child must not be the category itself, one of its ancestors, or an ancestor of a chosen parent.
const childPick = picker($("#cChildren"), {exclude: () => {
  const ex = new Set();
  if (editingCat) { ex.add(editingCat); ancestorIds(editingCat).forEach(i => ex.add(i)); }
  parentPick.get().forEach(p => { ex.add(p); ancestorIds(p).forEach(i => ex.add(i)); });
  return ex;
}});
function openCat(id) {
  editingCat = id; const c = id ? byId[id] : null;
  $("#catDlgTitle").textContent = c ? "Edit category" : "New category";
  $("#cName").value = c?.name || ""; $("#cDesc").value = c?.description || "";
  origParents = c ? c.parent_ids : (selected !== null ? [selected] : []);
  origChildren = c ? c.child_ids : [];
  parentPick.set(origParents); childPick.set(origChildren);
  $("#cDel").hidden = !c; $("#cErr").textContent = "";
  $("#catDlg").showModal(); $("#cName").focus();
}
$("#newCat").onclick = () => openCat(null);
$("#editCat").onclick = () => openCat(selected);
$("#cCancel").onclick = () => $("#catDlg").close();
$("#catForm").onsubmit = async e => {
  e.preventDefault(); $("#cErr").textContent = "";
  const name = $("#cName").value.trim(), description = $("#cDesc").value;
  if (!name) return;
  const P = parentPick.get(), C = childPick.get(), errs = [];
  try {
    let id = editingCat;
    if (!id) id = (await api("/api/categories", {method: "POST", body: {name, description}})).id;
    else await api(`/api/categories/${id}`, {method: "PATCH", body: {name, description}});
    const before = id === editingCat ? [origParents, origChildren] : [[], []];
    for (const p of before[0].filter(x => !P.includes(x))) await api(`/api/edges?parent_id=${p}&child_id=${id}`, {method: "DELETE"});
    for (const c of before[1].filter(x => !C.includes(x))) await api(`/api/edges?parent_id=${id}&child_id=${c}`, {method: "DELETE"});
    for (const p of P.filter(x => !before[0].includes(x)))
      await api("/api/edges", {method: "POST", body: {parent_id: p, child_id: id}}).catch(er => errs.push(`${byId[p]?.name} → ${name}: ${er.message}`));
    for (const c of C.filter(x => !before[1].includes(x)))
      await api("/api/edges", {method: "POST", body: {parent_id: id, child_id: c}}).catch(er => errs.push(`${name} → ${byId[c]?.name}: ${er.message}`));
    await loadCats(); await loadEntries();
    if (errs.length) { editingCat = id; origParents = byId[id].parent_ids; origChildren = byId[id].child_ids;
      parentPick.set(origParents); childPick.set(origChildren); $("#cErr").textContent = errs.join(" · "); return; }
    $("#catDlg").close(); toast("Category saved");
  } catch (er) { $("#cErr").textContent = er.message; }
};
$("#cDel").onclick = async () => {
  const c = byId[editingCat];
  if (!confirm(`Delete category “${c.name}”? Entries stay; only their link to it is removed. Child categories stay.`)) return;
  await api(`/api/categories/${editingCat}`, {method: "DELETE"});
  if (selected === editingCat) selected = null;
  $("#catDlg").close(); await loadCats(); await loadEntries(); toast("Category deleted");
};

/* ---------- entry dialog ---------- */
let editingEnt = null;
const entPick = picker($("#eCats"), {inheritedEl: $("#eInh")});
async function openEntry(id) {
  editingEnt = id; $("#eErr").textContent = "";
  const e = id ? await api(`/api/entries/${id}`) : null;
  $("#entDlgTitle").textContent = e ? `Edit entry #${e.id}` : "New entry";
  $("#eExt").value = e?.ext_id || ""; $("#eDesc").value = e?.description || "";
  $("#eData").value = e?.data != null ? JSON.stringify(e.data, null, 2) : "";
  entPick.set(e ? e.categories.map(c => c.id) : (selected !== null ? [selected] : []));
  $("#eDel").hidden = !e; $("#entDlg").showModal(); $("#eDesc").focus();
}
$("#newEntry").onclick = () => openEntry(null);
$("#eCancel").onclick = () => $("#entDlg").close();
$("#entForm").onsubmit = async ev => {
  ev.preventDefault(); $("#eErr").textContent = "";
  let data = null; const raw = $("#eData").value.trim();
  if (raw) { try { data = JSON.parse(raw); } catch (er) { $("#eErr").textContent = "Invalid JSON: " + er.message; return; } }
  const body = {ext_id: $("#eExt").value.trim() || null, description: $("#eDesc").value, data, category_ids: entPick.get()};
  try {
    if (editingEnt) await api(`/api/entries/${editingEnt}`, {method: "PATCH", body});
    else await api("/api/entries", {method: "POST", body});
    $("#entDlg").close(); await loadCats(); await loadEntries(); toast("Entry saved");
  } catch (er) { $("#eErr").textContent = er.message; }
};
$("#eDel").onclick = async () => {
  if (!confirm("Delete this entry?")) return;
  await api(`/api/entries/${editingEnt}`, {method: "DELETE"});
  $("#entDlg").close(); await loadCats(); await loadEntries(); toast("Entry deleted");
};

/* ---------- export current view ---------- */
function exportView(format) {
  const p = new URLSearchParams({format, recursive: $("#rec").checked});
  if (selected !== null) p.set("category_id", selected);
  location.href = "/api/export?" + p;
}
$("#expCsv").onclick = () => exportView("csv");
$("#expJson").onclick = () => exportView("json");

/* ---------- import ---------- */
$("#importLink").onclick = e => { e.preventDefault(); $("#importFile").click(); };
$("#importFile").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const replace = confirm("Replace ALL current data with this file?\nOK = replace, Cancel = merge");
  try { await api(`/api/import?replace=${replace}`, {method: "POST", body: await f.text()});
    await loadCats(); await loadEntries(); toast("Imported"); } catch (er) { toast(er.message); }
  e.target.value = "";
};

loadCats().then(loadEntries);
</script>
</body>
</html>
